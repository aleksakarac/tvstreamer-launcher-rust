[package]
name = "tvstreamer-launcher"
version = "0.1.0"
edition = "2024"
authors = ["Aleksa"]
description = "Lightweight media center launcher for Raspberry Pi"
license = "MIT"

[dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "fs", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["process", "signal"] }
dirs = "6"
once_cell = "1"
zbus = { version = "4", default-features = false, features = ["tokio"] }

[build-dependencies]
slint-build = "1.9"

# Performance optimizations
[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Link-time optimization
codegen-units = 1        # Better optimization
panic = "abort"          # Smaller binary
strip = true             # Strip symbols

[profile.release.package."*"]
opt-level = "z"

# Dev profile - faster compilation
[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2
